[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbit-gamepad"
version = "0.1.0"
description = "Use a BBC micro:bit V2 as a game controller on Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "evdev>=1.6",
    "mpremote>=1.22",
]

[project.scripts]
microbit-gamepad = "microbit_gamepad.cli:main"

[tool.setuptools.package-data]
microbit_gamepad = ["firmware/*.py"]
